<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{Nombre del negocio}}</title>
<meta name="description" content="{{Qué hace el negocio, en una frase}}">
<!-- Tipografías: reemplazá por la pareja elegida en references/tipografias.md -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..700&family=Schibsted+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Plan de diseño: cada color y fuente sale de acá. Cambiá los valores, no los nombres de uso. */
:root{
  --fondo:#000;
  --superficie:#141312;
  --texto:#ece7de;
  --texto-suave:#8f8a83;
  --acento:#d39a5c;
  --display:"Bodoni Moda", "Didot", serif;
  --cuerpo:"Schibsted Grotesk", "Helvetica Neue", Arial, sans-serif;
  --margen:clamp(16px, 4vw, 64px);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html.lenis,html.lenis body{height:auto}
.lenis.lenis-smooth{scroll-behavior:auto!important}
body{background:var(--fondo);color:var(--texto);font-family:var(--cuerpo);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--acento);outline-offset:4px}
h1,h2,h3{font-family:var(--display);font-weight:400;line-height:1;letter-spacing:-.015em;text-wrap:balance}
p{max-width:65ch}

/* Barra superior: se invierte sola sobre fondos claros u oscuros */
.barra{position:fixed;inset:0 0 auto 0;z-index:50;display:flex;justify-content:space-between;align-items:center;padding:22px var(--margen);mix-blend-mode:difference;color:#fff}
.barra nav{display:flex;gap:clamp(18px,2.6vw,40px);font-size:14px}

.seccion{padding:clamp(96px,14vh,160px) var(--margen)}

/* Recuadro para fotos que todavía no existen */
.foto-pendiente{display:grid;place-items:center;aspect-ratio:4/3;background:var(--superficie);color:var(--texto-suave);font-size:14px;text-align:center;padding:24px}

@media (max-width:900px){ .barra nav{display:none} }
@media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }
</style>
</head>
<body>

<header class="barra">
  <a href="#inicio">{{Marca}}</a>
  <nav aria-label="Secciones"><a href="#seccion-1">{{Sección}}</a><a href="#contacto">{{Acción principal}}</a></nav>
</header>

<main>
  <section class="portada" id="inicio" aria-label="Portada">
    <!-- El momento memorable va acá -->
  </section>
  <!-- Secciones según references/estructuras.md -->
</main>

<footer class="seccion"></footer>

<!-- Librerías con versión fija. Si no cargan, la web sigue funcionando sin animaciones. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js"></script>
<script>
(function(){
  const quieto = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!window.gsap || quieto) return;              // sin librerías o con movimiento reducido: web estática
  gsap.registerPlugin(ScrollTrigger);

  if (window.Lenis) {                               // scroll suave sincronizado con las animaciones
    const lenis = new Lenis({lerp: .085});
    lenis.on('scroll', ScrollTrigger.update);
    gsap.ticker.add(t => lenis.raf(t * 1000));
    gsap.ticker.lagSmoothing(0);
    document.querySelectorAll('a[href^="#"]').forEach(a => a.addEventListener('click', e => {
      const destino = document.querySelector(a.getAttribute('href'));
      if (destino) { e.preventDefault(); lenis.scrollTo(destino, {duration: 1.4}); }
    }));
  }

  // Pegá acá las recetas de references/movimiento.md

  addEventListener('load', () => ScrollTrigger.refresh());
})();
</script>
</body>
</html>
